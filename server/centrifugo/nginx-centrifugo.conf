# Configuration Nginx Reverse Proxy pour Centrifugo WebSockets & SSL Let's Encrypt
# À placer dans /etc/nginx/sites-available/ws.bricolemoi.ma

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    server_name ws.bricolemoi.ma; # Remplacez par votre nom de domaine ou sous-domaine VPS

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts pour WebSockets longue durée
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    listen 80;
}
